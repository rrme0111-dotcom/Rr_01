name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        run: |
          keytool -genkey -keystore app.keystore -alias twa \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=SweetWheel" -noprompt

      - name: Build APK with Bubblewrap
        run: |
          npx @bubblewrap/cli build --manifest android/twa-manifest.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sweet-wheel-apk
          path: android/app/release/app-release-signed.apk
